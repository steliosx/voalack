# Voalack CI. Jobs run on GitHub-hosted ubuntu-24.04 runners; on pushes, the full capture suite runs there too, in a
# pinned container (see docs/CI.md). CI is a check, not an approval.
name: CI

on:
  push:
    branches: [main, "vo/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    name: ack-core tests (installed wheel)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Refuse a fork pull request before checkout
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "fork pull request: refused by this workflow; a maintainer reruns it from a branch after review" >&2
          exit 1
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the wheel and run the core tests
        env:
          SRC: ${{ github.workspace }}
          OUT: ${{ runner.temp }}/evidence
          WORK: ${{ runner.temp }}/work
        run: sh ci/run_core_tests.sh
      - name: Show the test summary
        if: always()
        run: |
          echo "tested commit: $GITHUB_SHA (event: $GITHUB_EVENT_NAME)"
          cat "$RUNNER_TEMP/evidence/pytest-exit.txt" 2>/dev/null || echo "no pytest status recorded"
          tail -n 5 "$RUNNER_TEMP/evidence/pytest.txt" 2>/dev/null || true
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-evidence-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          if-no-files-found: error
          # Explicit files: anything else the job writes to its evidence directory is not published.
          path: |
            ${{ runner.temp }}/evidence/run.log
            ${{ runner.temp }}/evidence/pytest.txt
            ${{ runner.temp }}/evidence/pytest-exit.txt
            ${{ runner.temp }}/evidence/test-results.xml
            ${{ runner.temp }}/evidence/import-path.txt
            ${{ runner.temp }}/evidence/pip-freeze.txt
            ${{ runner.temp }}/evidence/pip-version.txt
            ${{ runner.temp }}/evidence/dist/*.whl
          retention-days: 90

  envelope:
    name: voalack envelope tests (installed wheels)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Refuse a fork pull request before checkout
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "fork pull request: refused by this workflow; a maintainer reruns it from a branch after review" >&2
          exit 1
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the wheels and run the envelope tests
        env:
          SRC: ${{ github.workspace }}
          OUT: ${{ runner.temp }}/evidence
          WORK: ${{ runner.temp }}/work
        run: sh ci/run_envelope_tests.sh
      - name: Show the test summary
        if: always()
        run: |
          echo "tested commit: $GITHUB_SHA (event: $GITHUB_EVENT_NAME)"
          cat "$RUNNER_TEMP/evidence/pytest-exit.txt" 2>/dev/null || echo "no pytest status recorded"
          tail -n 5 "$RUNNER_TEMP/evidence/pytest.txt" 2>/dev/null || true
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: envelope-evidence-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          if-no-files-found: error
          # Explicit files: anything else the job writes to its evidence directory is not published.
          path: |
            ${{ runner.temp }}/evidence/run.log
            ${{ runner.temp }}/evidence/pytest.txt
            ${{ runner.temp }}/evidence/pytest-exit.txt
            ${{ runner.temp }}/evidence/test-results.xml
            ${{ runner.temp }}/evidence/import-path.txt
            ${{ runner.temp }}/evidence/pip-freeze.txt
            ${{ runner.temp }}/evidence/pip-version.txt
            ${{ runner.temp }}/evidence/dist/*.whl
          retention-days: 90

  launcher:
    name: CI launcher failure paths (fake gh and smolvm)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Refuse a fork pull request before checkout
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "fork pull request: refused by this workflow; a maintainer reruns it from a branch after review" >&2
          exit 1
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the launcher tests
        env:
          SRC: ${{ github.workspace }}
          OUT: ${{ runner.temp }}/evidence
          WORK: ${{ runner.temp }}/work
        run: sh ci/run_launcher_tests.sh
      - name: Show the test summary
        if: always()
        run: |
          echo "tested commit: $GITHUB_SHA (event: $GITHUB_EVENT_NAME)"
          cat "$RUNNER_TEMP/evidence/pytest-exit.txt" 2>/dev/null || echo "no pytest status recorded"
          tail -n 5 "$RUNNER_TEMP/evidence/pytest.txt" 2>/dev/null || true
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launcher-evidence-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          if-no-files-found: error
          # Explicit files: anything else the job writes to its evidence directory is not published.
          path: |
            ${{ runner.temp }}/evidence/run.log
            ${{ runner.temp }}/evidence/pytest.txt
            ${{ runner.temp }}/evidence/pytest-exit.txt
            ${{ runner.temp }}/evidence/test-results.xml
          retention-days: 90

  secrets:
    name: secret scan (gitleaks 8.24.3; history, tree, archive members)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Refuse a fork pull request before checkout
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "fork pull request: refused by this workflow; a maintainer reruns it from a branch after review" >&2
          exit 1
      - name: Check out the exact commit with its full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned gitleaks
        # Official v8.24.3 release (tag ee6b3835, commit 107a41827bb6698dbbff756b2300537774a1d84c); the hash is the
        # gitleaks_8.24.3_checksums.txt entry for the Linux x64 tarball.
        run: |
          test "$(uname -m)" = x86_64
          mkdir "$RUNNER_TEMP/gitleaks"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks/archive.tar.gz"
          printf '%s  %s\n' 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c "$RUNNER_TEMP/gitleaks/archive.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks/archive.tar.gz" --directory "$RUNNER_TEMP/gitleaks" --no-same-owner gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version | grep -x 8.24.3
      - name: Scan history, tree and archive members
        env:
          SRC: ${{ github.workspace }}
          OUT: ${{ runner.temp }}/evidence
          WORK: ${{ runner.temp }}/work
          GITLEAKS: ${{ runner.temp }}/gitleaks/gitleaks
        run: sh ci/run_secret_scan.sh
      - name: Show the scan summary
        if: always()
        run: |
          echo "scanned commit: $GITHUB_SHA (event: $GITHUB_EVENT_NAME)"
          cat "$RUNNER_TEMP/evidence/scan-status.txt" 2>/dev/null || echo "no scan status recorded"
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secrets-evidence-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          if-no-files-found: error
          # Explicit files: anything else the job writes to its evidence directory is not published.
          path: |
            ${{ runner.temp }}/evidence/run.log
            ${{ runner.temp }}/evidence/scan-status.txt
            ${{ runner.temp }}/evidence/history.json
            ${{ runner.temp }}/evidence/tree.json
            ${{ runner.temp }}/evidence/archives.json
            ${{ runner.temp }}/evidence/archives-manifest.json
            ${{ runner.temp }}/evidence/archives-scan.log
          retention-days: 3

  capture:
    # The full capture suite: real PostgreSQL 18.7 (PGDG) and Alerta 9.1.0, as lab/run_capture.sh runs it in a
    # disposable microVM. Push runs of this repository only (bound by its ID, so a copy of this workflow in a fork does
    # not run it): they test the exact head a review names, and a pull request run (GitHub's merge commit) would repeat
    # about an hour of work for the same branch. Pull requests never reach this job, so it has no fork-PR step. Pushes
    # to vo/integration are skipped: that branch is only ever fast-forwarded to main's merge commit, so its run would
    # repeat main's on an identical tree.
    name: full capture suite (PostgreSQL 18.7, Alerta 9.1.0)
    if: github.event_name == 'push' && github.repository_id == '1442050691' && github.ref != 'refs/heads/vo/integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container:
      # python:3.12.14-slim-bookworm, the image the microVM runs use, pinned to the index digest Docker Hub served on
      # 2026-11-15. The job runs as root in the container, as the lab guest does. --shm-size: Docker's default 64 MiB
      # /dev/shm is smaller than a guest's, and PostgreSQL keeps its dynamic shared memory there. SYS_ADMIN with
      # AppArmor unconfined is needed because the anchor full-disk test mounts a 64 KiB tmpfs and would otherwise skip,
      # but every step of this job runs with it: treat the whole hosted VM as expendable. The job takes synthetic inputs
      # only and holds no secrets, OIDC or credentials beyond the read-only token. Never extend this to other jobs, and
      # never replace it with --privileged or a disabled seccomp profile.
      image: python@sha256:392307d22300de8b5986851a12d9176dfc0fc073e65bf6523ebd7dcbeb23564e
      options: --shm-size=1g --cap-add SYS_ADMIN --security-opt apparmor=unconfined
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the capture suite
        # OUT must be /out: some review-probe tests write their witnesses under /out when they are collected.
        env:
          SRC: ${{ github.workspace }}
          OUT: /out
          WORK: /work
        run: |
          mkdir /out /work
          {
            echo "repository_id $GITHUB_REPOSITORY_ID"
            echo "event $GITHUB_EVENT_NAME"
            echo "sha $GITHUB_SHA"
            echo "workflow_ref $GITHUB_WORKFLOW_REF"
            echo "run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT job $GITHUB_JOB"
            echo "runner $RUNNER_OS $RUNNER_ARCH image ${ImageOS:-unrecorded} ${ImageVersion:-unrecorded}"
            echo "container_image python@sha256:392307d22300de8b5986851a12d9176dfc0fc073e65bf6523ebd7dcbeb23564e (declared)"
            uname -srvmo
            grep '^PRETTY_NAME=' /etc/os-release
            python3 --version
          } > /out/ci-environment.txt
          cat /out/ci-environment.txt
          sh lab/run_capture.sh
      - name: Refuse skipped or missing tests
        # A skipped test is not a pass (CONTRIBUTING.md): the job fails unless every collected test ran and passed.
        run: |
          python3 -I - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse("/out/test-results.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          totals = {k: sum(int(s.get(k, "0")) for s in suites) for k in ("tests", "failures", "errors", "skipped")}
          cases = [c for s in suites for c in s.iter("testcase")]
          not_passed = [c for c in cases if any(c.find(t) is not None for t in ("failure", "error", "skipped"))]
          print("junit: suites", len(suites), "totals", totals, "testcases", len(cases), "not passed", len(not_passed))
          if (not suites or totals["tests"] == 0 or len(cases) != totals["tests"] or not_passed
                  or totals["failures"] or totals["errors"] or totals["skipped"]):
              sys.exit("capture suite: not every collected test ran and passed")
          PY
      - name: Show the test summary
        if: always()
        run: |
          echo "tested commit: $GITHUB_SHA (event: $GITHUB_EVENT_NAME)"
          cat /out/pg-version.txt 2>/dev/null || echo "no PostgreSQL version recorded"
          cat /out/pytest-exit.txt 2>/dev/null || echo "no pytest status recorded"
          tail -n 5 /out/pytest.txt 2>/dev/null || tail -n 20 /out/run.log 2>/dev/null || true
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-evidence-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          if-no-files-found: error
          # Explicit patterns: a file of any other kind that a test writes under /out is not published.
          path: |
            /out/*.txt
            /out/*.json
            /out/*.jsonl
            /out/*.log
            /out/test-results.xml
          retention-days: 90

  setup-pins:
    # Negative controls for the two pins lab/setup_guest.sh enforces before any test runs: the PGDG repository key
    # fingerprint and the PostgreSQL server version. Each case runs a copy of the script with exactly one pinned value
    # changed, and passes only if provisioning stops at that check with its exact message. A download or provisioning
    # failure does not produce that message, so it fails the case. The capture job is the positive control: it runs the
    # unchanged script. Same condition and image as capture, without its widened container options. Not a required
    # check.
    name: setup pin negatives (key fingerprint, server version)
    if: github.event_name == 'push' && github.repository_id == '1442050691' && github.ref != 'refs/heads/vo/integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case: [key, version]
    container:
      # The capture job's image (python:3.12.14-slim-bookworm, pinned by digest); it runs as root, as setup expects.
      image: python@sha256:392307d22300de8b5986851a12d9176dfc0fc073e65bf6523ebd7dcbeb23564e
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run setup with one pin changed and check where it stops
        # The evidence directory is a fixed container path, as /out is in the capture job, so the upload reads it as is.
        env:
          CASE: ${{ matrix.case }}
          EV: /evidence
        run: |
          mkdir -p "$EV/out" "$RUNNER_TEMP/work"
          case "$CASE" in
            key)
              old=B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
              new=0000000000000000000000000000000000000000
              sed "s/^PGDG_KEY_FPR=$old\$/PGDG_KEY_FPR=$new/" lab/setup_guest.sh > "$RUNNER_TEMP/neg.sh"
              want="PGDG repository key is not $new (got: $old)"
              ;;
            version)
              sed '/pg_num" = 180007/s/180007/180006/g' lab/setup_guest.sh > "$RUNNER_TEMP/neg.sh"
              want='PostgreSQL server_version_num is 180007, not 180006 (18.7)'
              ;;
            *)
              echo "unknown case: $CASE" >&2
              exit 2
              ;;
          esac
          fail=
          # The copy differs from the reviewed script in exactly one line.
          diff lab/setup_guest.sh "$RUNNER_TEMP/neg.sh" > "$EV/diff.txt" && rc=0 || rc=$?
          cat "$EV/diff.txt"
          [ "$rc" = 1 ] || fail="$fail diff-exit-$rc"
          [ "$(grep -c '^<' "$EV/diff.txt")" = 1 ] || fail="$fail diff-removed-lines"
          [ "$(grep -c '^>' "$EV/diff.txt")" = 1 ] || fail="$fail diff-added-lines"
          # Setup must fail with the pinned check's exact message.
          OUT="$EV/out" WORK="$RUNNER_TEMP/work" sh "$RUNNER_TEMP/neg.sh" > "$EV/setup.txt" 2>&1 && rc=0 || rc=$?
          echo "setup exit: $rc"
          [ "$rc" != 0 ] || fail="$fail setup-succeeded"
          grep -Fxq "$want" "$EV/setup.txt" || fail="$fail stop-message"
          # It stopped at that check, not before it and not after it.
          case "$CASE" in
            key)
              [ ! -e /usr/lib/postgresql/18/bin/postgres ] || fail="$fail postgres-installed"
              ;;
            version)
              [ -s "$EV/out/pg-version.txt" ] || fail="$fail no-pg-version"
              [ ! -e "$EV/out/pip-version.txt" ] || fail="$fail pip-version-written"
              ;;
          esac
          if [ -z "$fail" ]; then
            echo "PASS $CASE: setup exit $rc, stopped at the pinned check with its exact message" > "$EV/verdict.txt"
          else
            echo "FAIL $CASE: setup exit $rc; failed:$fail" > "$EV/verdict.txt"
          fi
          cat "$EV/verdict.txt"
          [ -z "$fail" ]
      - name: Show the summary
        if: always()
        run: |
          echo "tested commit: $GITHUB_SHA (event: $GITHUB_EVENT_NAME)"
          cat /evidence/verdict.txt 2>/dev/null || echo "no verdict recorded"
          tail -n 5 /evidence/setup.txt 2>/dev/null || true
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: setup-pins-${{ matrix.case }}-evidence-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          if-no-files-found: error
          # Explicit files and the *.txt files setup wrote to out/: nothing else under /evidence is published.
          path: |
            /evidence/diff.txt
            /evidence/setup.txt
            /evidence/verdict.txt
            /evidence/out/*.txt
          retention-days: 90
