<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">Planned acknowledgement flow</title>
<desc id="desc">Planned architecture, not a claim of implemented runtime. The existing PowerShell alarm feed runs from ONE to Alerta. Only an authorised human single-alert ACK triggers the proposed local PostgreSQL transaction, which captures the Alerta ACK and a durable candidate together. Candidate verification and an exact approved binding precede a separate ONE session owner worker writing the permitted source ACK. The worker then reads back source state and records an outcome note in Alerta. ONE-origin ACK mirroring is outside the current scope. Design agreed; implementation and live qualification remain open.</desc>
<defs>
<marker id="arrow-cobalt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5363F0"/></marker>
<marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#182033"/></marker>
</defs>
