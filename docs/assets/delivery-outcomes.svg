<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1680" viewBox="0 0 1280 1680" role="img" aria-labelledby="title desc">
<title id="title">Every outcome has a meaning: seven acknowledgement states</title>
<desc id="desc">Seven operator-facing acknowledgement states from the canonical design contract. LOCAL_ACK: Alerta changed locally; this never means remote success. Noneligible historical actions can remain local-only. QUEUED: a local transaction captured a candidate; verification and policy checks precede any remote access. REMOTE_CONFIRMED: the exact permitted target and occurrence, with expected ACK evidence, were observed under the qualified contract; no new send. ALREADY_ACKED: the source was already ACKed; make no attribution claim and do not re-ACK to add or overwrite a comment. BLOCKED: a named policy, identity, configuration or qualification reason prevents sending; no send. SUPERSEDED: a new approved binding or generation invalidated work before send; retain evidence, and never erase a possibly-sent old attempt. UNCERTAIN: mutation may have reached ONE, or its result cannot be bound safely; preserve the attempt and suspend affected mutation ownership. Read-only reconciliation only. Local acknowledgement alone does not confirm delivery.</desc>
<defs>
<marker id="arrow-cobalt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5363F0"/></marker>
